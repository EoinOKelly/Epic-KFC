# Epic Messaging API Nginx reverse proxy and edge rate limits.
#
# Install on Ubuntu-style Nginx as:
#   sudo cp server/backend/deploy/nginx/epic-messaging-api.conf \
#     /etc/nginx/sites-available/epic-messaging-api
#   sudo ln -sf /etc/nginx/sites-available/epic-messaging-api \
#     /etc/nginx/sites-enabled/epic-messaging-api
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# This file is intended to be included from the Nginx `http` context, which is
# how `/etc/nginx/sites-enabled/*` is normally included on Ubuntu.

limit_req_zone $binary_remote_addr zone=epic_register_ip:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=epic_login_ip:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=epic_refresh_ip:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=epic_prekey_ip:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=epic_message_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=epic_api_ip:10m rate=300r/m;

# If the provided TLS gateway forwards the original client IP, configure real
# IP handling only for trusted gateway addresses. Do not trust arbitrary public
# X-Forwarded-For headers.
#
# set_real_ip_from <trusted-gateway-ip-or-cidr>;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

upstream epic_messaging_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name kfc.theburkenator.com;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /api/v1/auth/register {
        limit_req zone=epic_register_ip burst=5 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location = /api/v1/auth/login {
        limit_req zone=epic_login_ip burst=5 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=epic_refresh_ip burst=10 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location ~ ^/api/v1/keys/users/.+/devices/.+/prekey-bundle$ {
        limit_req zone=epic_prekey_ip burst=30 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location = /api/v1/messages {
        limit_req zone=epic_message_ip burst=60 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location ~ ^/api/v1/messages/.+/forward$ {
        limit_req zone=epic_message_ip burst=30 nodelay;
        proxy_pass http://epic_messaging_api;
    }

    location /api/ {
        limit_req zone=epic_api_ip burst=120;
        proxy_pass http://epic_messaging_api;
    }

    location / {
        limit_req zone=epic_api_ip burst=120;
        proxy_pass http://epic_messaging_api;
    }
}
